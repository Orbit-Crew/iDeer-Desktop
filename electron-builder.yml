appId: com.orbitcrew.ideer.desktop
productName: iDeer Desktop
electronVersion: 22.3.27
afterPack: scripts/release/issue-107/after-pack.cjs
artifactBuildCompleted: scripts/release/issue-107/artifact-completed.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: .runtime
    to: runtime
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc']
  # Issue 115: the OpenCASCADE WASM converter (occt-import-js, pinned from the
  # linz commit via resources/provenance/linz-source.json). It ships outside
  # the asar so the glue can read its .wasm sibling with fs at runtime.
  - from: resources/occt
    to: occt
  - from: resources/provenance
    to: provenance
  - from: resources/updates
    to: updates
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  executableName: ideer-desktop
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: resources/nsis/process-guard.nsh
  artifactName: ideer-desktop-${version}-windows-${arch}-setup.${ext}
  shortcutName: iDeer Desktop
  uninstallDisplayName: iDeer Desktop
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
