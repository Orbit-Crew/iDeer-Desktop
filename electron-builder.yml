appId: com.orbitcrew.ideer.desktop
productName: iDeer Desktop
electronVersion: 22.3.27
afterPack: scripts/release/issue-107/after-pack.cjs
artifactBuildCompleted: scripts/release/issue-107/artifact-completed.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: .runtime
    to: runtime
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc']
  # Issue 119: the OCCT converter is no longer packed here — it is installed
  # by the installer's selectable CAD 查看器 section (resources/nsis/
  # components.nsh, generated from resources/components/catalog.json) or
  # topped up later from an offline component pack, always pinned by the
  # same provenance hashes.
  # The component catalog plus the afterPack-written components-lock.json
  # (app version + per-artifact SHA-256) ship with every install: the lock
  # is what offline top-ups verify against.
  - from: resources/components
    to: components
  - from: resources/provenance
    to: provenance
  - from: resources/updates
    to: updates
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  executableName: ideer-desktop
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Issue 119: installer.nsh chains the unchanged process guard with the
  # generated selectable-component script (tiers + engineering components).
  include: resources/nsis/installer.nsh
  artifactName: ideer-desktop-${version}-windows-${arch}-setup.${ext}
  shortcutName: iDeer Desktop
  uninstallDisplayName: iDeer Desktop
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
