name: Desktop PR baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-contract:
    # ubuntu-24.04 deliberately not used: the smoke drives Electron 22,
    # whose Chromium sandbox cannot launch under 24.04's AppArmor
    # user-namespace restriction ("Process failed to launch" in
    # xvfb-run). Revisit when Electron is upgraded past the sandbox fix.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './local-runtime[test]'
      - run: python scripts/verify-runtime-source.py
      - run: python -m ruff check local-runtime --select E9,F63,F7,F82
      - run: python -m pytest local-runtime/tests -q
        env:
          PYTHONPATH: local-runtime
      - run: npm ci
      - run: npm run verify:provenance
      # Issue #88: per-item third-party inventory must match what ships.
      - run: npm run verify:third-party
      # Issue #120: capability × system matrix locked to the #89 ledger.
      - run: npm run verify:matrix
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: artifacts/
  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './local-runtime[test]'
      - run: python scripts/prepare-runtime.py
      - run: python scripts/verify-runtime-source.py
      - run: python -m ruff check local-runtime --select E9,F63,F7,F82
      - run: python -m pytest local-runtime/tests -q
        env:
          PYTHONPATH: local-runtime
      - run: npm ci
      # Issue #88: per-item third-party inventory must match what ships.
      - run: npm run verify:third-party
      - run: npm run typecheck
      - run: npm run test:security
      # Issue #43: dual-shell proof that the acceptance drivers read UTF-8
      # JSON correctly and pass inner status through to the outer exit code.
      - run: ./scripts/verify-issue-43.ps1
        shell: pwsh
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Issue 119: the component lane compiles and silently runs the real
      # generated NSIS sections (选择即装/未选不装 + uninstall). It must run
      # after dist:win — a fresh runner only has makensis once electron-builder
      # has fetched it into .cache/electron-builder/nsis.
      - run: npm run test:components
      - run: ./scripts/windows-install-smoke.ps1
        shell: pwsh
      - name: Record candidate hashes
        shell: pwsh
        run: |
          Get-ChildItem dist/*setup.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File artifacts/SHA256.txt
          git rev-parse HEAD | Out-File artifacts/candidate.txt
          node --version | Out-File artifacts/build-node.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-not-release-approved
          path: |
            dist/*setup.exe
            dist/*.blockmap
            dist/builder-effective-config.yaml
            artifacts/
            package-lock.json
